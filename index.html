<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Draw on Click</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: auto;
            display: flex;
            align-items: center;
            min-height: 100vh;
        }

        #background {
            position: relative;
            width: 709px;
            /* Fixed dimensions to maintain pixel scale */
            height: 734px;
            /* Fixed dimensions to maintain pixel scale */
            margin: auto;
            flex-shrink: 0;
            overflow: hidden;
            background: url('Maze.png') no-repeat center center;
            background-size: 100% 100%;
            /* Display at exact pixel dimensions */
            image-rendering: crisp-edges;
            /* Improve sharpness */
            image-rendering: pixelated;
            /* For pixel art-style images */
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid green;
            pointer-events: none;
        }

        .circle2 {
            position: absolute;
            border-radius: 50%;
            border: 2px solid red;
            pointer-events: none;
        }

        .polar-overlay {
            position: absolute;
            pointer-events: none;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            opacity: 0.85;
        }

        h3 {
            color: cyan;
            /* Set the text color to cyan */
            position: fixed;
            /* Fix the position so it stays at the forefront */
            top: 0px;
            /* Adjust vertical positioning */
            left: 50px;
            /* Adjust horizontal positioning */
            z-index: 1000;
            /* Ensure it appears above other elements */
            background-color: rgba(0, 0, 0, 0.1);
            /* Optional: Add a semi-transparent background */
            padding: 5px 10px;
            /* Optional: Add padding for better visibility */
            border-radius: 5px;
            /* Optional: Rounded corners for aesthetic */
            margin: 10px;
        }

        #imageName {
            color: yellow;
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-size: 48px;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px 15px;
            cursor: pointer;
            user-select: none;
            z-index: 1000;
            border-radius: 10px;
            transition: background-color 0.3s, transform 0.2s;
        }

        .arrow:hover {
            background-color: rgba(0, 0, 0, 0.8);
            transform: translateY(-50%) scale(1.1);
        }

        .arrow:active {
            transform: translateY(-50%) scale(0.95);
        }

        #leftArrow {
            left: 20px;
        }

        #rightArrow {
            right: 20px;
        }
    </style>
</head>

<body>
    <h3>L.Click: Green circle &nbsp; M.Click: Red Circle &nbsp; Shift+Click: Polar Overlay &nbsp; Spacebar: Clear &nbsp;
        ←/→: Switch Image</h3>
    <div id="imageName">Maze</div>
    <div id="leftArrow" class="arrow">←</div>
    <div id="rightArrow" class="arrow">→</div>
    <div id="background"></div>

    <script src="config.js"></script>
    <script>
        const background = document.getElementById('background');
        const imageNameDisplay = document.getElementById('imageName');
        const leftArrow = document.getElementById('leftArrow');
        const rightArrow = document.getElementById('rightArrow');

        // Use configuration from config.js
        const images = mapConfig;
        let currentImageIndex = 0;
        let imagesLoaded = false;

        // Preload all images and get their natural dimensions
        function preloadImages() {
            return Promise.all(images.map((mapData, index) => {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        // Store natural dimensions with scale applied
                        mapData.width = Math.round(img.naturalWidth * (mapData.scaleX || 1.0));
                        mapData.height = Math.round(img.naturalHeight * (mapData.scaleY || 1.0));
                        resolve();
                    };
                    img.onerror = reject;
                    img.src = mapData.file;
                });
            }));
        }

        // Function to switch images
        function switchImage(index) {
            if (!imagesLoaded) return;

            currentImageIndex = index;
            const img = images[index];

            // Set container to image's scaled dimensions
            background.style.width = `${img.width}px`;
            background.style.height = `${img.height}px`;
            background.style.backgroundImage = `url('${img.file}')`;
            imageNameDisplay.textContent = img.name;

            // Clear circles and overlays when switching images
            const allCircles = document.querySelectorAll('.circle, .circle2, .polar-overlay');
            allCircles.forEach(circle => circle.remove());
        }

        // Preload images then initialize
        preloadImages().then(() => {
            imagesLoaded = true;
            switchImage(currentImageIndex);
        }).catch(error => {
            console.error('Error loading images:', error);
        });

        // Arrow button navigation
        leftArrow.addEventListener('click', () => {
            currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
            switchImage(currentImageIndex);
        });

        rightArrow.addEventListener('click', () => {
            currentImageIndex = (currentImageIndex + 1) % images.length;
            switchImage(currentImageIndex);
        });

        // Spacebar deletes all circles and overlays
        document.addEventListener('keydown', function (event) {
            if (event.key === ' ') {
                event.preventDefault(); // Prevent the default scrolling behavior
                const allCircles = document.querySelectorAll('.circle, .circle2, .polar-overlay');
                allCircles.forEach(circle => circle.remove());
            } else if (event.key === 'ArrowLeft') {
                event.preventDefault();
                currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
                switchImage(currentImageIndex);
            } else if (event.key === 'ArrowRight') {
                event.preventDefault();
                currentImageIndex = (currentImageIndex + 1) % images.length;
                switchImage(currentImageIndex);
            }
        });

        // Preload the polar coords overlay image once to get its natural dimensions
        const polarImg = new Image();
        polarImg.src = polarCoordsFile;

        // Left click: green circle  |  Shift+click: polar coords overlay
        background.addEventListener('click', (event) => {
            const rect = background.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            if (event.shiftKey) {
                // Remove any existing polar overlays first
                background.querySelectorAll('.polar-overlay').forEach(el => el.remove());

                const mapData = images[currentImageIndex];
                const scale = mapData.polarCoordsScale || 1.0;
                const w = Math.round(polarImg.naturalWidth * scale);
                const h = Math.round(polarImg.naturalHeight * scale);

                const overlay = document.createElement('img');
                overlay.src = polarCoordsFile;
                overlay.className = 'polar-overlay';
                overlay.style.width = `${w}px`;
                overlay.style.height = `${h}px`;
                overlay.style.left = `${x - w / 2}px`;
                overlay.style.top = `${y - h / 2}px`;

                background.appendChild(overlay);
            } else {
                const circle = document.createElement('div');
                const radius = images[currentImageIndex].radius;

                circle.style.width = `${radius * 2}px`;
                circle.style.height = `${radius * 2}px`;
                circle.style.left = `${x - radius}px`;
                circle.style.top = `${y - radius}px`;
                circle.style.backgroundColor = 'rgba(0, 255, 0, 0.05)';
                circle.className = 'circle';

                background.appendChild(circle);
            }
        });

        // Middle click to add a red circle
        background.addEventListener('mousedown', (event) => {
            if (event.button === 1) { // Middle mouse button
                event.preventDefault(); // Prevent default middle-click behavior

                const circle2 = document.createElement('div');
                const radius = images[currentImageIndex].radius; // Get radius from config

                // Get position relative to the background div
                const rect = background.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                circle2.style.position = 'absolute';
                circle2.style.width = `${radius * 2}px`;
                circle2.style.height = `${radius * 2}px`;
                circle2.style.left = `${x - radius}px`;
                circle2.style.top = `${y - radius}px`;
                circle2.style.backgroundColor = 'rgba(255, 0, 0, 0.15)'; // Red with 80% transparency
                circle2.style.borderRadius = '50%'; // Make it a circle
                circle2.style.pointerEvents = 'none'; // Prevent it from blocking mouse events
                circle2.className = 'circle2';

                background.appendChild(circle2);
            }
        });
    </script>

</body>

</html>
